name: Publish Desktop Release to GitHub

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop version tag, for example desktop-v0.5.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Stamp desktop version from tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^desktop-v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Desktop tags must use desktop-vX.Y.Z or desktop-vX.Y.Z-prerelease format."
          }
          $version = $Matches.version
          $packagePath = "website/electron/package.json"
          $package = Get-Content -Raw $packagePath | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $packagePath

          $backendVersionPath = "src/kiro_crew/__init__.py"
          $backendVersion = Get-Content -Raw $backendVersionPath
          $versionPattern = [regex]'(?m)^__version__ = ".*"$'
          $stampedBackendVersion = $versionPattern.Replace(
            $backendVersion,
            "__version__ = `"$version`"",
            1
          )
          if ($stampedBackendVersion -eq $backendVersion) {
            throw "Could not stamp the backend version in $backendVersionPath."
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD $backendVersionPath),
            $stampedBackendVersion,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Output "Desktop version: $version"

      - name: Install desktop dependencies
        shell: pwsh
        run: npm ci --prefix website

      - name: Build Windows installer
        shell: bash
        run: bash packaging/build-desktop.sh

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path . -Recurse -File -Filter "KiroCrew Setup *.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Using installer: $($installer.FullName)"

      - name: Publish release assets and updater metadata
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $params = @{
            Repository = $env:GITHUB_REPOSITORY
            Tag = $tag
            InstallerPath = "${{ steps.artifact.outputs.path }}"
            Confirm = $false
          }
          if ("${{ inputs.prerelease }}" -eq "true" -or $tag.Contains("-")) { $params.Prerelease = $true }
          .\scripts\publish-github-release.ps1 @params
